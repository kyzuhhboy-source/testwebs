
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TestWebs</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="container">

    <section class="card">

      <div class="logo">
        TW
      </div>

      <p class="badge">TESTWEBS</p>

      <h1>
        Website Berhasil
        <span>Jalan 🚀</span>
      </h1>

      <p class="description">
        Selamat datang di TestWebs. HTML, CSS, dan JavaScript
        sudah terhubung dengan GitHub Pages.
      </p>

      <div class="status-box">
        <div class="status-dot"></div>
        <span id="status">Menunggu JavaScript...</span>
      </div>

      <button id="testBtn">
        Tes JavaScript
      </button>

      <div class="info">
        <div>
          <strong>HTML</strong>
          <span>Connected</span>
        </div>

        <div>
          <strong>CSS</strong>
          <span>Connected</span>
        </div>

        <div>
          <strong>JS</strong>
          <span id="jsStatus">Checking...</span>
        </div>
      </div>

    </section>

    <footer>
      TestWebs • GitHub Pages
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
